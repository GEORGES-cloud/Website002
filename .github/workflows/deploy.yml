name: Desplegar a Hostinger

# ARQUITECTURA REAL (verificada el 2026-07-26 mapeando el FTP):
# La web la sirve una app Node.js de Hostinger. El repo está clonado en
# /nodejs (server.mjs + Express + public/) y Express sirve /nodejs/public.
# El home de la cuenta FTP es /public_html — un scaffold de Hostinger que
# YA NO SIRVE NADA (era el docroot de la etapa estática, hasta jul-2026).
# Por eso este workflow sube con rutas ABSOLUTAS a /nodejs/public/ y
# después toca /nodejs/tmp/restart.txt para reiniciar la app.
#
# Requiere 3 secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER · FTP_USERNAME · FTP_PASSWORD  (hPanel -> Archivos -> Cuentas FTP)

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Subir public/ a /nodejs/public
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar por FTP (solo archivos cambiados)
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: public/
          server-dir: /nodejs/public/
          dangerous-clean-slate: false

      # El FTP de Hostinger falla a veces al guardar el archivo de estado del
      # sync (550/timeout intermitente) aunque los archivos ya estén subidos.
      # Un segundo intento re-sincroniza lo poco que falte.
      - name: Reintento (el FTP de Hostinger falla a veces)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: public/
          server-dir: /nodejs/public/
          dangerous-clean-slate: false

      # 1) El sync omite dotfiles: subir .htaccess a mano (paridad repo-servidor).
      # 2) Tocar /nodejs/tmp/restart.txt: la app se reinicia y coge cambios.
      # 3) Limpieza única: borrar /public_html/public_html, creado por error
      #    el 26-07 cuando el sync aterrizó en el home nuevo del FTP.
      - name: Dotfiles, reinicio de la app y limpieza
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          npm install basic-ftp@5 --no-fund --no-audit --silent
          cat > post-deploy.mjs <<'EOF'
          import * as ftp from 'basic-ftp';
          import { writeFileSync } from 'node:fs';
          async function intento(n) {
            const c = new ftp.Client(45000);
            try {
              await c.access({ host: process.env.FTP_SERVER, user: process.env.FTP_USERNAME, password: process.env.FTP_PASSWORD, secure: true, secureOptions: { rejectUnauthorized: false } });
              await c.uploadFrom('public/.htaccess', '/nodejs/public/.htaccess');
              console.log('SUBIDO /nodejs/public/.htaccess (intento ' + n + ')');
              writeFileSync('restart.txt', new Date().toISOString());
              await c.uploadFrom('restart.txt', '/nodejs/tmp/restart.txt');
              console.log('REINICIO solicitado (tmp/restart.txt)');
              try {
                await c.removeDir('/public_html/public_html');
                console.log('LIMPIEZA hecha: /public_html/public_html eliminado');
              } catch (e) {
                console.log('LIMPIEZA: nada que borrar (' + e.message.split('\n')[0] + ')');
              }
              c.close();
              return true;
            } catch (e) { console.log('intento ' + n + ' falló: ' + e.message.split('\n')[0]); c.close(); return false; }
          }
          let ok = false;
          for (let n = 1; n <= 4 && !ok; n++) { ok = await intento(n); if (!ok) await new Promise(r => setTimeout(r, 8000)); }
          if (!ok) process.exit(1);
          EOF
          node post-deploy.mjs
